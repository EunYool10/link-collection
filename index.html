<!doctype html>
<html lang="ko">

<title>EunYool — 링크 모음</title>
<style>
  :root { color-scheme: light; --ink:#202522; --muted:#777d76; --line:#e8e8e1; --green:#315d4b; --paper:#f7f6f2; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:32px 20px; background:var(--paper); color:var(--ink); font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; }
  main { width:min(100%, 480px); }
  .topline { display:flex; align-items:center; justify-content:center; gap:9px; color:var(--muted); font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
  .dot { width:7px; height:7px; border-radius:50%; background:#78a68b; box-shadow:0 0 0 4px #78a68b22; }
  header { text-align:center; margin:36px 0 30px; }
  .avatar { width:76px; height:76px; display:block; overflow:hidden; margin:0 auto 20px; border-radius:50%; background:#e5ece5; }`n  .avatar img { display:block; width:100%; height:100%; object-fit:cover; }
  h1 { margin:0; font-size:32px; letter-spacing:-.055em; font-weight:750; }
  .intro { margin:10px 0 0; color:var(--muted); font-size:14px; line-height:1.7; }
  .links { display:grid; gap:12px; }
  .card { display:flex; align-items:center; gap:15px; min-height:78px; padding:15px 17px; background:#fff; border:1px solid var(--line); border-radius:16px; color:inherit; text-decoration:none; transition:transform .18s ease, border-color .18s ease, box-shadow .18s ease; }
  .card:hover { transform:translateY(-2px); border-color:#cbd8ce; box-shadow:0 8px 24px #243b2b0b; }
  .icon { width:43px; height:43px; display:grid; place-items:center; flex:none; border-radius:13px; background:#f2f4ef; color:var(--green); }
  .icon svg { width:21px; height:21px; }
  .copy { flex:1; min-width:0; }
  .title { display:block; font-size:15px; font-weight:650; letter-spacing:-.02em; }
  .url { display:block; overflow:hidden; margin-top:5px; color:var(--muted); font-size:12px; text-overflow:ellipsis; white-space:nowrap; }
  .arrow { color:#969b94; font-size:18px; }
  footer { margin-top:28px; text-align:center; color:#92968f; font-size:11px; letter-spacing:.04em; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition:none !important; } }
</style>
</head>
